name: Validate and publish
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # Match the pinned @playwright/test version in package.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - name: Reproduce the offline evidence
        run: npm run evidence -- --out local-data/ci-evidence
      - name: Upload the evidence packet
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-data/ci-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy playground
        id: deployment
        uses: actions/deploy-pages@v4
